name: Portable Windows x64 PoC
on:
  workflow_call:
    inputs:
      module_path:
        type: string
        default: C:/LetsPeppolPoC/beidpkcs11.dll
      artifact_name:
        type: string
        default: portable-windows-x64-poc
  workflow_dispatch:
  push:
    branches: [codex/clean-windows-poc]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: 6.11.2
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
      - name: Configure native app for fixed private module path
        shell: pwsh
        env:
          BEID_MODULE_PATH: ${{ inputs.module_path || 'C:/LetsPeppolPoC/beidpkcs11.dll' }}
        run: |
          cmake -S . -B build/portable -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' `
            "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE/lib/libelectronic-id" `
            "-DELECTRONIC_ID_BEID_MODULE_PATH=$env:BEID_MODULE_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build/portable --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/portable -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage executable and runtime (no Belgian middleware)
        shell: pwsh
        env:
          BEID_MODULE_PATH: ${{ inputs.module_path || 'C:/LetsPeppolPoC/beidpkcs11.dll' }}
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'build/portable-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          $app = Join-Path $env:GITHUB_WORKSPACE 'build/portable/src/app/Release/web-eid.exe'
          if (-not (Test-Path $app)) { throw 'Web eID executable is missing' }
          Copy-Item -LiteralPath $app -Destination $package
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --dir $package (Join-Path $package 'web-eid.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # windeployqt can report success without staging the MSVC runtime.
          # Copy the redistributable CRT beside the executable for a clean PC.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio locator is missing' }
          $vsRoot = & $vswhere -latest -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio installation was not found' }
          $redistRoot = Join-Path $vsRoot 'VC/Redist/MSVC'
          $crt = Get-ChildItem -LiteralPath $redistRoot -Directory | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/Microsoft.VC143.CRT' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $crt) { throw 'MSVC x64 redistributable CRT was not found' }
          Get-ChildItem -LiteralPath $crt -Filter '*.dll' -File |
            Copy-Item -Destination $package
          foreach ($required in @('msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path (Join-Path $package $required))) { throw "CRT runtime missing: $required" }
          }
          $cache = Get-Content 'build/portable/CMakeCache.txt'
          $includeLine = $cache | Where-Object { $_ -match '^OPENSSL_INCLUDE_DIR:PATH=' } | Select-Object -First 1
          if (-not $includeLine) { throw 'OpenSSL include location missing from CMake cache' }
          $includeDir = ($includeLine -split '=', 2)[1]
          $opensslBin = Join-Path (Split-Path $includeDir) 'bin'
          foreach ($name in @('libcrypto-3-x64.dll', 'libssl-3-x64.dll')) {
            $file = Join-Path $opensslBin $name
            if (-not (Test-Path $file)) { throw "OpenSSL runtime missing: $file" }
            Copy-Item -LiteralPath $file -Destination $package
          }
          Copy-Item 'third-party/belgian-eid/LICENSE' -Destination (Join-Path $package 'Belgian-eID-LGPL.txt')
          Copy-Item 'third-party/lets-peppol/LICENSE' -Destination (Join-Path $package 'LetsPeppol-MIT.txt')
          Copy-Item 'LICENSE' -Destination (Join-Path $package 'Web-eID-MIT.txt')
          $licenses = Join-Path $package 'licenses'
          New-Item -ItemType Directory -Path $licenses -Force | Out-Null
          Get-ChildItem 'build/portable/vcpkg_installed/x64-windows/share' -Directory | ForEach-Object {
            $notice = Join-Path $_.FullName 'copyright'
            if (Test-Path $notice) { Copy-Item $notice (Join-Path $licenses ($_.Name + '-copyright.txt')) }
          }
          Get-ChildItem $env:QT_ROOT_DIR -Recurse -Directory -Filter LICENSES | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $licenses ('Qt-' + $_.Parent.Name)) -Recurse -Force
          }
          @{
            app_commit = $env:GITHUB_SHA
            library_commit = (& git -C lib/libelectronic-id rev-parse HEAD)
            module_resolution = $env:BEID_MODULE_PATH
            app_sha256 = (Get-FileHash (Join-Path $package 'web-eid.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            qt_version = '6.11.2'
            workflow_run = $env:GITHUB_RUN_ID
          } | ConvertTo-Json | Set-Content (Join-Path $package 'NATIVE-BUILD.json') -Encoding utf8
          Copy-Item 'poc/README.md' -Destination (Join-Path $package 'PoC-instructions.md')
          Copy-Item 'poc/scripts/clean-pc-preflight.ps1' -Destination $package
          Get-ChildItem $package -Recurse -File | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($package, $_.FullName)
            '{0} *{1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
          } | Set-Content -Encoding utf8 (Join-Path $package 'SHA256SUMS.txt')
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath 'build/portable-windows-x64-poc.zip'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || 'portable-windows-x64-poc' }}
          path: build/portable-windows-x64-poc.zip
          if-no-files-found: error
