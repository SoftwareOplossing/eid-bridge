name: Belgian eID PoC checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check reversible browser-host helper
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\poc\tests\test_host_registration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build probe and loader tests (no Qt, middleware or card needed)
        run: |
          cmake -S poc/native -B build/poc-native -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/poc-native --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/poc-native -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify raw/PDF signatures and tamper cases
        run: |
          python -m pip install -r poc/pdf-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s poc/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
